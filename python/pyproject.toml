[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "originblame"
version = "0.2.0"
description = "Record- and token-level data provenance for AI training datasets"
readme = "PYPI.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Haolin Xue", email = "hxue@mail.nwpu.edu.cn"}]
keywords = ["provenance", "attribution", "machine-unlearning", "training-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12.0",
]

[project.urls]
Homepage = "https://github.com/tzbkk/originblame"
Repository = "https://github.com/tzbkk/rust-originblame"
Issues = "https://github.com/tzbkk/rust-originblame/issues"

[project.scripts]
ob = "ob.cli.__main__:app"

[tool.maturin]
manifest-path = "../Cargo.toml"
module-name = "ob._ob_native"
python-source = "src"
features = ["python"]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "maturin>=1.0,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["src"]
